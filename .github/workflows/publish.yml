name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Run tests before publishing
    runs-on: ubuntu-latest
    container:
      image: firedrakeproject/firedrake-vanilla-default:dev-main

    env:
      OMP_NUM_THREADS: 1
      MPLBACKEND: Agg

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y python3-venv
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up virtual environment
        run: |
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          pip install --upgrade pip

      - name: Install gadopt
        run: |
          . .venv/bin/activate
          pip install git+https://github.com/g-adopt/g-adopt.git

      - name: Install gdrift
        run: |
          . .venv/bin/activate
          pip install -e .
          pip install matplotlib pytest boto3

      - name: Run unit tests
        run: |
          . .venv/bin/activate
          python -m pytest tests/ -v --maxfail=5 --tb=short

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build setuptools-scm

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          WHEEL=$(ls dist/*.whl)
          WHEEL_VERSION=$(python -c "import re, sys; m=re.search(r'gdrift-([^-]+)-', sys.argv[1]); print(m.group(1))" "$WHEEL")
          echo "Tag version: $TAG"
          echo "Wheel version: $WHEEL_VERSION"
          if [ "$TAG" != "$WHEEL_VERSION" ]; then
            echo "ERROR: Tag version ($TAG) does not match wheel version ($WHEEL_VERSION)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
