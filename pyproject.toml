[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdrift"
version = "0.1.0"
description = "Geodynamics Data Reformatting and Integration Facilitation Toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Sia Ghelichkhani", email = "siavash.ghelichkhan@anu.edu.au"},
]
keywords = [
    "geodynamics",
    "seismic tomography",
    "mantle convection",
    "thermodynamics",
    "earth models",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "h5py>=3.0",
    "tqdm>=4.0",
    "boto3>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "flake8>=5.0",
    "mypy>=0.990",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-jupyter>=0.24",
]
examples = [
    "matplotlib>=3.5",
    "jupytext>=1.15",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]
all = [
    "gdrift[dev,docs,examples]",
]

[project.urls]
Homepage = "https://github.com/g-adopt/g-drift"
Documentation = "https://gdrift.gadopt.org"
Repository = "https://github.com/g-adopt/g-drift"
Issues = "https://github.com/g-adopt/g-drift/issues"

[tool.setuptools]
packages = ["gdrift"]

[tool.setuptools.package-data]
gdrift = ["datasets.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
norecursedirs = ["ARCHIVE", ".git", "__pycache__", "*.egg-info"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.flake8]
ignore = ["E501"]
max-line-length = 120

[tool.black]
line-length = 120

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
